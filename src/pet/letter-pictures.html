<!doctype html>
<!--
  letter.html with the letter's pictures from wherever it has them: a
  letter shown with them (its "显示图片", or its sender's always,
  mailPictures). With no referrer, so they are not told her page's address.
  The rest as letter.html says.
-->
<html data-letter>
  <head>
    <meta charset="utf-8" />
    <meta name="referrer" content="no-referrer" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src http: https: data:; style-src 'unsafe-inline'; font-src data:" />
  </head>
  <body></body>
</html>
