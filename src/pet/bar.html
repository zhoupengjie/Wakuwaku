<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: http://asset.localhost asset:; connect-src ipc: http://ipc.localhost; style-src 'self' 'unsafe-inline'; script-src 'self'"
    />
    <title>wakuwaku bar</title>
    <link rel="stylesheet" href="bar.css" />
  </head>
  <body>
    <!-- Her taskbar on another display (bars.rs, bar.js): Start, the windows there, the clock;
         her capsule at its start while a prompt waits. Split, the dock on hers: Start and the
         programs, quick settings and the clock after them if set so. -->
    <div id="mica"></div>
    <div id="bar">
      <div id="glass"></div>
      <div id="her" hidden>
        <span class="face"><span class="sheet"><span class="film"></span></span></span><span class="words"></span><span class="chev">&#xE76C;</span>
      </div>
      <div id="lead"></div>
      <div id="apps"><button class="start" data-bar="start"></button><button class="tview" data-bar="tasks" hidden><i class="tv-glyph">&#xE7C4;</i></button><div id="wins"></div><i class="dsep" id="minsep" hidden></i><div id="mins"></div><i class="dsep" id="binsep" hidden></i><div class="win bin" data-bar="recycleBin" hidden><img alt="" draggable="false" /></div></div>
      <div id="end">
        <div class="quick" data-bar="quick" hidden><span class="fi net"><span class="back"></span><span class="front"></span></span><span class="fi vol"><span class="back"></span><span class="front"></span></span></div>
        <div class="clock" data-bar="notifications"></div>
        <div class="desk" data-bar="desktop"></div>
      </div>
    </div>
    <script type="module" src="bar-main.js"></script>
  </body>
</html>
