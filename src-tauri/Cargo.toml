[package]
name = "wakuwaku"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Pengjie Zhou"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
sys-locale = "0.3"
ureq = { version = "3.4.2", features = ["json"] }
# Mail (mail.rs): IMAP over the system's TLS, and letters' headers read.
native-tls = "0.2"
mail-parser = { version = "0.11", features = ["full_encoding"] }
base64 = "0.22"

[features]
default = ["custom-protocol"]
# Serve the pages from the binary; without it Tauri waits for a dev server.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[target."cfg(windows)".dependencies]
tauri-winrt-notification = "0.8.1"
winreg = "0.56.0"
